<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="style.css">
  <title>Frontend Mentor | Social Links Profile</title>
</head>

<body>
  <main class="main-container">
    <article class="profile">

      <div class="picture-container">
        <img class="user-picture" src="images/avatar-jessica.jpeg" alt="Jessica Randall Profile Picture">
      </div>

      <h1 class="user-name">Jessica Randall</h1>
      <p class="user-address">London, United Kingdom</p>
      <p class="user-bio">"Front-end developer and avid reader."</p>

      <ul class="user-socials">
        <li><a class="social-links" href="https://github.com/" target="_blank">GitHub</a></li>
        <li><a class="social-links" href="https://www.frontendmentor.io/" target="_blank">Frontend Mentor</a></li>
        <li><a class="social-links" href="https://www.linkedin.com/" target="_blank">LinkedIn</a></li>
        <li><a class="social-links" href="https://x.com/" target="_blank">Twitter</a></li>
        <li><a class="social-links" href="https://www.instagram.com/" target="_blank">Instagram</a></li>
      </ul>

    </article>
  </main>
</body>

</html>
